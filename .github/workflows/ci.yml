name: Node SDK CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Alibaba-Agent-Sandbox/python-sdk
          ref: v0.4.0a3
          path: vendor/python-sdk
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --index-url https://pypi.org/simple "agent-sandbox-server==0.4.0a3"
      - run: python -c "import agent_sandbox.server"
      - name: Compare the complete Python and Node configuration schema
        run: |
          python - <<'PY_SCHEMA'
          import json
          import subprocess
          import sys
          from pathlib import Path

          exported = subprocess.check_output(
              [sys.executable, "vendor/python-sdk/client-sdk/src/agent_sandbox/utils/config_keys.py", "--json"],
              text=True,
          )
          assert json.loads(exported) == json.loads(Path("src/config-keys.json").read_text())
          print("Complete Python/Node configuration schema matches")
          PY_SCHEMA
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Test HTTP, configuration and the real Python runtime loop
        run: npm test
      - name: Verify the package includes built ESM and type exports
        run: npm pack --dry-run
