name: Node SDK CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Alibaba-Agent-Sandbox/python-sdk
          ref: e86cb0be24e0083a27396b260298e7cf27b660d6
          path: vendor/python-sdk
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ./vendor/python-sdk/server-sdk
      - run: python -c "import agent_sandbox.server"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Test HTTP, configuration and the real Python runtime loop
        run: npm test
      - name: Verify the package includes built ESM and type exports
        run: npm pack --dry-run
